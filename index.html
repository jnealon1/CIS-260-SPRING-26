<style>
/* GENERAL STYLES */
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background-color: #f4f4f9;
    color: #333;
    display: flex;
}

/* SIDEBAR */
.sidebar {
    width: 220px;
    position: fixed;
    left: 0;
    top: 0;
    height: 100%;
    background-color: #2c2f48;
    color: white;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 20px;
    text-align: center;
}

/* PROFILE PHOTO */
.profile-photo {
    width: 150px;
    height: 150px;
    border-radius: 50%;
    object-fit: cover;
    object-position: center;
    box-shadow: 0 4px 15px rgba(0,0,0,0.2);
    border: 3px solid #fff;
    transition: all 0.3s ease;
}

.profile-photo:hover {
    box-shadow: 0 0 30px 8px #00aaff, 0 4px 15px rgba(0,0,0,0.3);
    transform: scale(1.05);
}

/* FALLBACK (THIS IS THE FIX 🔥) */
.profile-photo::after {
    content: "Image not found";
    display: none;
}

/* TEXT */
.sidebar h2 {
    margin: 10px 0 5px 0;
}

.sidebar p {
    font-size: 14px;
    margin-bottom: 15px;
    color: #b0b3c6;
}

/* ICON LINKS */
.icon-links {
    display: flex;
    gap: 15px;
}

.icon-link {
    color: white;
    font-size: 22px;
}

.icon-link:hover {
    color: #4da6ff;
}


/* MINIMAL RESUME LINK */
.resume-link {
    margin-top: 5px;
    color: #b0b3c6;
    text-decoration: none;
    font-size: 14px;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding-bottom: 4px;
    border-bottom: 2px solid transparent;
    transition: all 0.3s ease;
}

.resume-link:hover {
    color: #4da6ff;
    border-bottom: 2px solid #4da6ff;
}

</style>
</head>
